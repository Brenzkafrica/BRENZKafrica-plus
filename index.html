<!-- BRENZKafrica Plus Desktop Reliability Layer -->
<script>
(function(){
 const nativeFetch = window.fetch.bind(window);
 const DEFAULT_TIMEOUT = 12000;
 window.BRENZKAFRICA_NATIVE_FETCH = nativeFetch;
 window.BRENZKAFRICA_FETCH_TIMEOUT = DEFAULT_TIMEOUT;
 window.brenzSafeFetch = async function(input, options){
  const opts = Object.assign({}, options || {});
  const timeout = Number(opts.timeout || DEFAULT_TIMEOUT);
  delete opts.timeout;
  const controller = new AbortController();
  const externalSignal = opts.signal;
  let timer;
  if(externalSignal){
   if(externalSignal.aborted) controller.abort();
   else externalSignal.addEventListener('abort', ()=>controller.abort(), {once:true});
  }
  timer = setTimeout(()=>controller.abort(), timeout);
  opts.signal = controller.signal;
  try { return await nativeFetch(input, opts); }
  finally { clearTimeout(timer); }
 };
})();
</script>

/* ENTERTAINMENT */
.entertainment-section{
position:relative
}
.entertainment-tabs{
display:flex;
align-items:center;
gap:9px;
overflow-x:auto;
padding:4px 2px 17px;
scrollbar-width:none;
-webkit-overflow-scrolling:touch
}
.entertainment-tabs::-webkit-scrollbar{display:none}
.entertainment-tab{
flex:0 0 auto;
border:1px solid rgba(255,255,255,.10);
background:#151515;
color:#aaa;
padding:9px 15px;
border-radius:20px;
font-size:11px;
font-weight:800;
transition:.2s
}
.entertainment-tab:hover{
color:#fff;
border-color:#444
}
.entertainment-tab.active{
background:#fff;
color:#000;
border-color:#fff
}
.entertainment-panel{display:none}
.entertainment-panel.active{display:block}
.entertainment-card{
position:relative;
flex:0 0 275px;
height:165px;
overflow:hidden;
background:#151515;
border:1px solid rgba(255,255,255,.08);
border-radius:9px;
cursor:pointer;
transition:.25s ease
}
.entertainment-card:hover{
transform:translateY(-5px) scale(1.015);
border-color:#444;
box-shadow:0 16px 35px rgba(0,0,0,.55)
}
.entertainment-card img{
width:100%;
height:100%;
object-fit:cover;
transition:.4s
}
.entertainment-card:hover img{transform:scale(1.06)}
