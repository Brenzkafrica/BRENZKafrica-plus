<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BRENZKafrica Plus</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #ffffff;
    }

    /* HEADER */
    header {
      padding: 20px;
      background: #000000;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .plus {
      color: #ffffff;
    }

    .menu {
      color: #aaa;
      font-size: 14px;
    }

    /* MAIN */
    main {
      max-width: 1200px;
      margin: auto;
      padding-bottom: 60px;
    }

    /* FEATURED */
    .featured {
      padding: 25px 15px;
    }

    .featured-card {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      background: #111;
    }

    .featured-card img {
      width: 100%;
      height: 500px;
      object-fit: cover;
      display: block;
    }

    .featured-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 50px 25px 25px;
      background: linear-gradient(
        transparent,
        rgba(0,0,0,0.95)
      );
    }

    .featured-overlay h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .featured-overlay p {
      color: #ccc;
      max-width: 600px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .watch-button {
      border: none;
      background: #ffffff;
      color: #000000;
      padding: 13px 24px;
      border-radius: 7px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .watch-button:hover {
      opacity: 0.85;
    }

    /* SECTION */
    .section {
      padding: 10px 15px 25px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 15px;
    }

    /* PLAYLIST */
    .playlist {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .video-card {
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .video-card:hover {
      transform: translateY(-4px);
    }

    .thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222;
      overflow: hidden;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-icon {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .card-info {
      padding: 13px;
    }

    .card-info h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .card-info p {
      font-size: 13px;
      color: #888;
    }

    /* PLAYER */
    .player-section {
      display: none;
      padding: 20px 15px 35px;
    }

    .player-container {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      max-height: 650px;
      display: block;
      background: #000;
    }

    .player-info {
      padding: 18px;
      background: #111;
    }

    .player-info h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .player-info p {
      color: #999;
      font-size: 14px;
    }

    .close-player {
      margin-top: 12px;
      background: transparent;
      color: #aaa;
      border: 1px solid #444;
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .featured-card img {
        height: 350px;
      }

      .featured-overlay h1 {
        font-size: 25px;
      }

      .featured-overlay {
        padding: 45px 18px 18px;
      }

      .playlist {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .card-info {
        padding: 10px;
      }

      .card-info h3 {
        font-size: 14px;
      }

      .card-info p {
        font-size: 12px;
      }

      .play-icon {
        width: 40px;
        height: 40px;
        font-size: 17px;
      }
    }
  </style>
</head>
