<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BRENZKafrica Plus — Admin</title>
<meta name="theme-color" content="#070707">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--surface:#111;--surface2:#171717;--text:#fff;--muted:#8c8c8c;--red:#e50914;--gold:#e7bd69;--green:#31d17c;--border:rgba(255,255,255,.09);--max:1700px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}
.topbar{height:70px;position:sticky;top:0;z-index:50;background:rgba(7,7,7,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px}.brand{font-size:22px;font-weight:900}.brand span{color:var(--red)}.admin-badge{font-size:9px;letter-spacing:1.2px;margin-left:9px;padding:5px 7px;border-radius:6px;background:var(--red);font-weight:900}.top-right{margin-left:auto;display:flex;gap:10px;align-items:center}.user-pill{font-size:12px;color:#ccc}.btn{border:1px solid var(--border);background:#171717;color:#fff;border-radius:8px;padding:9px 13px;font-weight:800;font-size:12px}.btn:hover{border-color:#444}.btn-primary{background:var(--red);border-color:var(--red)}.btn-danger{background:#2a090b;border-color:#641117;color:#ffb5b8}.btn-small{padding:6px 9px;font-size:11px}
.layout{max-width:var(--max);margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 70px)}.sidebar{border-right:1px solid var(--border);padding:20px 14px}.nav-title{font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:#555;margin:13px 10px 8px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#999;border:0;padding:11px 12px;border-radius:8px;font-weight:800;font-size:12px}.nav button:hover,.nav button.active{background:#181818;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--red)}
main{padding:28px;min-width:0}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--red);font-weight:900}.page-head h1{font-size:30px;margin:5px 0}.page-head p{color:var(--muted);font-size:12px;margin:0}.actions{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:17px}.stat .label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#777}.stat .value{font-size:25px;font-weight:900;margin-top:7px}.stat .hint{font-size:10px;color:#666;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}.panel-head h2{font-size:14px;margin:0}.panel-head span{margin-left:auto;color:#666;font-size:10px}.panel-body{padding:15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px 11px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;text-align:left;vertical-align:middle}.table th{color:#777;text-transform:uppercase;letter-spacing:.7px;font-size:8px}.muted{color:#777}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}.badge-green{background:rgba(49,209,124,.12);color:var(--green)}.badge-red{background:rgba(229,9,20,.12);color:#ff6a72}.badge-gold{background:rgba(231,189,105,.12);color:var(--gold)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.search{background:#0b0b0b;border:1px solid var(--border);color:#fff;border-radius:8px;padding:9px 11px;min-width:220px}.select{background:#0b0b0b;border:1px solid var(--border);color:#fff;border-radius:8px;padding:9px 11px}.notice{padding:10px 12px;border-radius:8px;background:#151515;color:#aaa;font-size:11px;margin-bottom:12px}.notice.error{background:#24090b;color:#ff9da2}.notice.success{background:#0b2016;color:#8ee8b5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal-card{width:min(720px,100%);max-height:92vh;overflow:auto;background:#111;border:1px solid #292929;border-radius:14px}.modal-head{padding:17px;border-bottom:1px solid var(--border);display:flex;align-items:center}.modal-head h3{margin:0;font-size:16px}.close{margin-left:auto;background:transparent;border:0;color:#aaa;font-size:24px}.form{padding:17px;display:grid;gap:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.8px;font-weight:900}.field input,.field textarea,.field select{width:100%;background:#090909;border:1px solid #292929;color:#fff;border-radius:8px;padding:10px}.field textarea{min-height:100px;resize:vertical}.check{display:flex;align-items:center;gap:8px;color:#aaa;font-size:11px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#111;border:1px solid var(--border);border-radius:14px;padding:26px}.login-card h1{margin:0 0 6px}.login-card p{color:#777;font-size:12px}.login-form{display:grid;gap:11px;margin-top:20px}.login-form input{background:#080808;border:1px solid #292929;color:#fff;border-radius:8px;padding:12px}.empty{padding:28px;text-align:center;color:#666;font-size:12px}.danger-zone{margin-top:20px;padding:14px;border:1px solid #4a1115;background:#18090a;border-radius:10px}.footer-note{color:#555;font-size:9px;margin-top:25px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:190px 1fr}.grid{grid-template-columns:1fr}}
@media(max-width:700px){.topbar{padding:0 14px}.sidebar{display:none}.layout{display:block}.stats{grid-template-columns:1fr 1fr}main{padding:18px}.page-head{align-items:start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.user-pill{display:none}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="eyebrow">BRENZKAFRICA PLUS</div>
    <h1>Admin Console</h1>
    <p>Private administration area. Only accounts with the <b>admin</b> role may enter.</p>
    <form id="loginForm" class="login-form">
      <input id="loginEmail" type="email" placeholder="Admin email" autocomplete="email" required>
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit">Sign in to Admin</button>
      <div id="loginMessage" class="notice hidden"></div>
    </form>
  </div>
</div>

<div id="appView" class="hidden">
<header class="topbar"><div class="brand">BRENZK<span>africa</span> <span style="color:#fff">+</span><span class="admin-badge">ADMIN</span></div><div class="top-right"><span id="adminEmail" class="user-pill"></span><button class="btn btn-small" id="refreshBtn">Refresh</button><button class="btn btn-small" id="signOutBtn">Sign Out</button></div></header>
<div class="layout">
<aside class="sidebar"><div class="nav">
<div class="nav-title">Manage</div>
<button class="active" data-page="overview">Overview</button>
<button data-page="content">Content</button>
<button data-page="series">Series & Episodes</button>
<button data-page="live">Live Events</button>
<button data-page="plans">Subscription Plans</button>
<button data-page="users">Users</button>
<button data-page="subscriptions">Subscriptions</button>
<button data-page="payments">Payments</button>
<button data-page="newsletter">Newsletter</button>
<button data-page="advertising">Advertising &amp; Partners</button>
<div class="nav-title">System</div>
<button data-page="audit">Audit Log</button>
<button data-page="sources">Sources & Partners</button>
</div></aside>
<main id="main"></main>
</div>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close" id="modalClose">×</button></div><div id="modalBody"></div></div></div>

<script>
const SUPABASE_URL='https://fcddfmfpzbilagphpsxs.supabase.co';
const SUPABASE_ANON_KEY=window.BRENZKAFRICA_SUPABASE_ANON_KEY||'sb_publishable_DvCK1wkFnYc1-yu7mlp9zA_wHtQ8Q5u';
/* Set the anon key above or inject window.BRENZKAFRICA_SUPABASE_ANON_KEY before this script. Never put a service-role key here. */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let adminUser=null,currentPage='overview',cache={};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=(minor,currency='USD')=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency}).format(Number(minor||0)/100)}catch{return `${currency} ${(Number(minor||0)/100).toFixed(2)}`}};
const date=v=>v?new Date(v).toLocaleString():'';
function notice(msg,type=''){return `<div class="notice ${type}">${esc(msg)}</div>`}
function showLoginMessage(msg,type='error'){const e=$('loginMessage');e.className='notice '+type;e.textContent=msg}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};

async function getSession(){const {data}=await sb.auth.getSession();return data.session}
async function ensureAdmin(){const session=await getSession();if(!session)return false;const {data,error}=await sb.from('profiles').select('id,display_name,role').eq('id',session.user.id).single();if(error||!data||data.role!=='admin'){await sb.auth.signOut();showLoginMessage('This account does not have administrator access.');return false}adminUser={...session.user,profile:data};return true}
async function init(){if(!SUPABASE_ANON_KEY){showLoginMessage('Supabase anon key is not configured in this admin file.');return}if(await ensureAdmin())showApp();}
function showApp(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('adminEmail').textContent=adminUser.email||'';renderPage('overview') }
$('loginForm').onsubmit=async e=>{e.preventDefault();showLoginMessage('Signing in…','');const {error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error){showLoginMessage(error.message);return}if(await ensureAdmin()){showApp()}else if($('loginMessage').textContent===''){showLoginMessage('Administrator access required.')}};
$('signOutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('refreshBtn').onclick=()=>renderPage(currentPage,true);
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPage(b.dataset.page)});

async function q(table,select='*',order='created_at',ascending=false){let query=sb.from(table).select(select);if(order)query=query.order(order,{ascending});const r=await query; if(r.error)throw r.error;return r.data||[]}
async function count(table){const r=await sb.from(table).select('*',{count:'exact',head:true});if(r.error)throw r.error;return r.count||0}
async function writeAudit(action,targetType,targetId,metadata={}){try{await sb.from('admin_audit_log').insert({actor_id:adminUser.id,action,target_type:targetType,target_id:String(targetId||''),metadata})}catch(e){console.warn('Audit unavailable',e)}}

async function renderPage(page,force=false){currentPage=page;const m=$('main');m.innerHTML='<div class="empty">Loading admin console…</div>';try{if(page==='overview')await overview(force);else if(page==='content')await contentPage(force);else if(page==='series')await seriesPage(force);else if(page==='live')await livePage(force);else if(page==='plans')await plansPage(force);else if(page==='users')await usersPage(force);else if(page==='subscriptions')await subscriptionsPage(force);else if(page==='payments')await paymentsPage(force);else if(page==='newsletter')await newsletterPage(force);else if(page==='advertising')await advertisingPage(force);else if(page==='audit')await auditPage(force);else if(page==='sources')await sourcesPage(force)}catch(e){m.innerHTML=notice(e.message||String(e),'error')}}

async function overview(){const [content,profiles,subs,payments,live,ads]=await Promise.all([count('content'),count('profiles'),count('subscriptions'),count('payment_transactions'),count('live_events'),count('advertising_campaigns')]);$('main').innerHTML=`<div class="page-head"><div><div class="eyebrow">CONTROL CENTER</div><h1>Admin Overview</h1><p>Manage the BRENZKafrica Plus platform from one private console.</p></div></div><div class="stats"><div class="stat"><div class="label">Content</div><div class="value">${content}</div><div class="hint">Catalogue records</div></div><div class="stat"><div class="label">Users</div><div class="value">${profiles}</div><div class="hint">Registered profiles</div></div><div class="stat"><div class="label">Subscriptions</div><div class="value">${subs}</div><div class="hint">All subscription records</div></div><div class="stat"><div class="label">Payments</div><div class="value">${payments}</div><div class="hint">Transaction ledger</div></div><div class="stat"><div class="label">Live</div><div class="value">${live}</div><div class="hint">Live event records</div></div><div class="stat"><div class="label">Advertising</div><div class="value">${ads}</div><div class="hint">Campaign records</div></div></div><div class="grid"><section class="panel"><div class="panel-head"><h2>Platform Operations</h2></div><div class="panel-body">${notice('This console is intentionally separate from the public BRENZKafrica Plus frontend. Changes made here are stored in Supabase and can be reflected by the public site on its next data refresh.','success')}<p style="font-size:11px;color:#888;line-height:1.7">Use <b>Content</b> to publish catalogue titles, <b>Series & Episodes</b> for episodic content, <b>Live Events</b> for broadcasts, <b>Subscription Plans</b> for pricing, and the financial/user areas for operational monitoring.</p></div></section><section class="panel"><div class="panel-head"><h2>Security</h2></div><div class="panel-body">${notice('Admin access is role-gated through public.profiles.role. The browser must only contain the Supabase anon key; never put the service-role key or payment secrets in this page.','success')}<p style="font-size:11px;color:#888;line-height:1.7">The existing professional layer defines the admin role and audit foundation.</p></div></section></div>`}

async function contentPage(){const data=await q('content','id,title,description,content_type,category,country,thumbnail_url,video_url,creator,license,attribution,is_original,is_featured,is_published,release_date','release_date',false);cache.content=data;$('main').innerHTML=`<div class="page-head"><div><div class="eyebrow">CATALOGUE</div><h1>Content</h1><p>Create, edit, feature, publish and unpublish catalogue titles.</p></div><div class="actions"><button class="btn btn-primary" onclick="contentForm()">+ Add Content</button></div></div><div class="toolbar"><input class="search" id="tableSearch" placeholder="Search titles…"><select class="select" id="publishFilter"><option value="all">All</option><option value="published">Published</option><option value="draft">Drafts</option></select></div><section class="panel"><div class="panel-body"><div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Featured</th><th>Release</th><th>Actions</th></tr></thead><tbody id="contentRows"></tbody></table></div></div></section>`;renderContentRows();$('tableSearch').oninput=renderContentRows;$('publishFilter').onchange=renderContentRows}
function renderContentRows(){const s=($('tableSearch')?.value||'').toLowerCase();const f=$('publishFilter')?.value||'all';const rows=(cache.content||[]).filter(x=>(x.campaign_title||'').toLowerCase().includes(s)&&(f==='all'||(f==='published'?x.is_published:!x.is_published)));$('contentRows').innerHTML=rows.map(x=>`<tr><td><b>${esc(x.campaign_title)}</b><div class="muted">#${esc(x.id)}</div></td><td>${esc(x.category||x.content_type||'—')}</td><td>${x.is_published?'<span class="badge badge-green">Published</span>':'<span class="badge badge-red">Draft</span>'}</td><td>${x.is_featured?'<span class="badge badge-gold">Featured</span>':'—'}</td><td>${esc(x.release_date||'—')}</td><td><button class="btn btn-small" onclick="contentForm('${esc(x.id)}')">Edit</button> <button class="btn btn-small ${x.is_published?'btn-danger':''}" onclick="toggleContentPublish('${esc(x.id)}',${!x.is_published})">${x.is_published?'Unpublish':'Publish'}</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No content found.</td></tr>'}
function contentForm(id){const x=(cache.content||[]).find(a=>String(a.id)===String(id))||{};openModal(id?'Edit Content':'Add Content',`<form class="form" id="contentForm"><div class="form-grid"><div class="field full"><label>Title</label><input name="title" value="${esc(x.campaign_title)}" required></div><div class="field"><label>Content Type</label><input name="content_type" value="${esc(x.content_type)}" placeholder="movie / series / documentary / original"></div><div class="field"><label>Category</label><input name="category" value="${esc(x.category)}"></div><div class="field"><label>Country</label><input name="country" value="${esc(x.country)}"></div><div class="field"><label>Creator</label><input name="creator" value="${esc(x.creator)}"></div><div class="field full"><label>Description</label><textarea name="description">${esc(x.description)}</textarea></div><div class="field full"><label>Thumbnail URL</label><input name="thumbnail_url" value="${esc(x.thumbnail_url)}"></div><div class="field full"><label>Video URL</label><input name="video_url" value="${esc(x.video_url)}"></div><div class="field"><label>License</label><input name="license" value="${esc(x.license)}"></div><div class="field"><label>Attribution</label><input name="attribution" value="${esc(x.attribution)}"></div><div class="field"><label>Release Date</label><input type="date" name="release_date" value="${esc(x.release_date?.slice?.(0,10)||'')}"></div><div class="field"><label>Flags</label><label class="check"><input type="checkbox" name="is_original" ${x.is_original?'checked':''}> Original</label><label class="check"><input type="checkbox" name="is_featured" ${x.is_featured?'checked':''}> Featured</label><label class="check"><input type="checkbox" name="is_published" ${x.is_published?'checked':''}> Published</label></div></div><button class="btn btn-primary" type="submit">${id?'Save Changes':'Create Content'}</button>${id?` <button type="button" class="btn btn-danger" onclick="deleteContent('${esc(id)}')">Delete</button>`:''}</form>`);$('contentForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const row={title:f.get('title'),description:f.get('description'),content_type:f.get('content_type'),category:f.get('category'),country:f.get('country'),creator:f.get('creator'),license:f.get('license'),attribution:f.get('attribution'),thumbnail_url:f.get('thumbnail_url'),video_url:f.get('video_url'),release_date:f.get('release_date')||null,is_original:f.has('is_original'),is_featured:f.has('is_featured'),is_published:f.has('is_published')};const r=id?await sb.from('content').update(row).eq('id',id):await sb.from('content').insert(row);if(r.error){alert(r.error.message);return}await writeAudit(id?'update_content':'create_content','content',id||'new',{title:row.title});closeModal();renderPage('content',true)}}
async function toggleContentPublish(id,value){const r=await sb.from('content').update({is_published:value}).eq('id',id);if(r.error){alert(r.error.message);return}await writeAudit(value?'publish_content':'unpublish_content','content',id);renderPage('content',true)}
async function deleteContent(id){if(!confirm('Delete this content record? This cannot be undone.'))return;const r=await sb.from('content').delete().eq('id',id);if(r.error){alert(r.error.message);return}await writeAudit('delete_content','content',id);closeModal();renderPage('content',true)}

async function seriesPage(){let series=[],episodes=[];try{series=await q('series','*','created_at',false)}catch(e){}try{episodes=await q('episodes','*','created_at',false)}catch(e){}cache.series=series;cache.episodes=episodes;$('main').innerHTML=`<div class="page-head"><div><div class="eyebrow">EPISODIC CONTENT</div><h1>Series & Episodes</h1><p>Manage series, seasons and episode records where the corresponding Supabase tables exist.</p></div></div><div class="grid"><section class="panel"><div class="panel-head"><h2>Series</h2><span>${series.length} records</span></div><div class="panel-body"><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Title</th><th>Description</th></tr></thead><tbody>${series.map(x=>`<tr><td>${esc(x.id)}</td><td><b>${esc(x.campaign_title||x.name||'Untitled')}</b></td><td class="muted">${esc((x.description||'').slice(0,100))}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No series records or table unavailable.</td></tr>'}</tbody></table></div></div></section><section class="panel"><div class="panel-head"><h2>Episodes</h2><span>${episodes.length} records</span></div><div class="panel-body"><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Episode</th><th>Title</th><th>Premium</th><th>Published</th></tr></thead><tbody>${episodes.map(x=>`<tr><td>${esc(x.id)}</td><td>S${esc(x.season_id||'—')} · E${esc(x.episode_number||'—')}</td><td><b>${esc(x.campaign_title||'Untitled')}</b></td><td>${x.is_premium?'<span class="badge badge-gold">Premium</span>':'Free'}</td><td>${esc(x.published_at||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No episode records or table unavailable.</td></tr>'}</tbody></table></div></div></section></div>`}

async function livePage(){const data=await q('live_events','id,title,description,thumbnail,status,start_time,end_time,is_featured,stream_url','start_time',false);cache.live=data;$('main').innerHTML=`<div class="page-head"><div><div class="eyebrow">BROADCASTING</div><h1>Live Events</h1><p>Schedule and manage live broadcasts.</p></div><button class="btn btn-primary" onclick="liveForm()">+ Add Event</button></div><section class="panel"><div class="panel-body"><div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>Status</th><th>Start</th><th>Featured</th><th>Actions</th></tr></thead><tbody>${data.map(x=>`<tr><td><b>${esc(x.campaign_title)}</b></td><td>${esc(x.status)}</td><td>${esc(date(x.start_time))}</td><td>${x.is_featured?'Yes':'No'}</td><td><button class="btn btn-small" onclick="liveForm('${esc(x.id)}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No live events.</td></tr>'}</tbody></table></div></div></section>`}

function mediaLines(items){return (Array.isArray(items)?items:[]).map(m=>[m.type||'image',m.src||'',m.alt||'',m.poster||''].join('|')).join('\n')}
function parseMediaLines(raw){
  return String(raw||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const p=line.split('|').map(x=>x.trim());const type=(p[0]||'image').toLowerCase();return {type:type==='video'?'video':'image',src:p[1]||'',alt:p[2]||'',poster:p[3]||''}}).filter(x=>x.src);
}

image|https://example.com/slide2.jpg|Second slide
video|https://example.com/ad.mp4|Video ad|https://example.com/poster.jpg">${esc(mediaLines(x.media))}</textarea><div class="muted">One item per line: type|media URL|alt text|poster URL (poster is optional and mainly for video). Uploaded files are added automatically.</div></div><div class="field"><label>CTA text</label><input name="cta_text" value="${esc(x.cta_text||'Learn More')}"></div><div class="field"><label>CTA URL</label><input name="cta_url" value="${esc(x.cta_url)}" placeholder="https://advertiser.example"></div><div class="field"><label>Slideshow seconds</label><input type="number" min="2.5" step="0.5" name="duration_ms" value="${esc((Number(x.slideshow_duration||6000)/1000).toString())}"></div><div class="field"><label>Priority</label><input type="number" name="priority" value="${esc(x.priority??0)}"></div><div class="field"><label>Start</label><input type="datetime-local" name="start_at" value="${esc(x.starts_at?.slice?.(0,16)||'')}"></div><div class="field"><label>End</label><input type="datetime-local" name="end_at" value="${esc(x.ends_at?.slice?.(0,16)||'')}"></div><div class="field full"><label class="check"><input type="checkbox" name="is_active" ${x.is_active!==false?'checked':''}> Active campaign</label></div></div><button class="btn btn-primary" type="submit">${id?'Save Changes':'Create Campaign'}</button></form>`);

async function uploadAdvertisingMedia(input){
  const status=$('advertisingUploadStatus');
  const textarea=document.querySelector('#advertisingForm textarea[name="media"]');
  const files=Array.from(input?.files||[]);
  if(!files.length)return;
  if(!adminUser?.id){if(status)status.textContent='Admin session required.';return;}
  if(status)status.textContent=`Uploading ${files.length} file${files.length===1?'':'s'}…`;
  let added=0;
  for(const file of files){
    try{
      const isVideo=file.type.startsWith('video/');
      const folder=isVideo?'video':'image';
      const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const path=`${folder}/${adminUser.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${clean}`;
      const upload=await sb.storage.from('advertising-media').upload(path,file,{contentType:file.type||undefined,upsert:false});
      if(upload.error)throw upload.error;
      const pub=sb.storage.from('advertising-media').getPublicUrl(path);
      const type=isVideo?'video':'image';
      const line=`${type}|${pub.data.publicUrl}|${file.name.replace(/\|/g,' ')}`;
      textarea.value=(textarea.value.trim()?textarea.value.trim()+'\n':'')+line;
      added++;
      if(status)status.textContent=`Uploaded ${added} of ${files.length}: ${file.name}`;
    }catch(err){
      console.error('Advertising media upload failed',err);
      if(status)status.textContent=`Upload failed for ${file.name}: ${err.message||err}`;
      alert(`Could not upload ${file.name}.\n\n${err.message||err}`);
    }
  }
  input.value='';
  if(status&&added)status.textContent=`${added} file${added===1?'':'s'} uploaded successfully. Review the Media items below, then save the campaign.`;
}

async function toggleAdvertising(id,value){const r=await sb.from('advertising_campaigns').update({is_active:value,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){alert(r.error.message);return}await writeAudit(value?'activate_advertising_campaign':'disable_advertising_campaign','advertising_campaigns',id);renderPage('advertising',true)}
async function deleteAdvertising(id){if(!confirm('Delete this advertising campaign?'))return;const r=await sb.from('advertising_campaigns').delete().eq('id',id);if(r.error){alert(r.error.message);return}await writeAudit('delete_advertising_campaign','advertising_campaigns',id);renderPage('advertising',true)}
